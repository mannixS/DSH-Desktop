# electron-builder 双平台打包配置
appId: com.deepseek.dshdesktop
productName: DSH Desktop
copyright: Copyright © 2026 DeepSeek Harness Client Team

# 程序自动更新源（electron-updater）
# 指向 GitHub Releases，打包时生成 latest.yml / latest-mac.yml 随 Release 发布
publish:
  provider: github
  owner: mannixS
  repo: DSH-Desktop

# 应用图标（build/icons 为 buildResources）
icon: icon.png

directories:
  output: dist
  buildResources: build/icons

files:
  - src/**/*
  - renderer/**/*
  - package.json

# 排除内核目录与开发依赖（内核在运行时按需安装到用户数据目录）
asarUnpack:
  - resources/**

# 内置内核：打包前由 `npm run fetch-kernel` 生成单文件归档 vendor/kernel.tar.gz，
# 安装后位于 process.resourcesPath/kernel，首启由客户端解压导入用户数据目录。
# 采用单文件归档可避免 NSIS 对 3 万+ 小文件逐个解压导致的安装缓慢。
extraResources:
  - from: vendor/kernel/bundle-info.json
    to: kernel/bundle-info.json
  - from: vendor/kernel.tar.gz
    to: kernel/kernel.tar.gz
  # 内置 Node.js（系统无 Node 时的兜底运行时，process.resourcesPath/node）
  - from: vendor/node
    to: node
    filter:
      - '**/*'
      - '!node_modules/**'

win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: DSH Desktop
  # 安装程序图标与卸载程序图标
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  # 安装引导界面右侧大图（必须 164x314 bmp，由构建时自动从 png 转换）
  installerHeaderIcon: icon.ico

# 注意：macOS 产物使用 zip 而非 dmg。
# GitHub Actions 的 macos-latest 已迁移到 arm64 runner，在 arm64 上交叉创建
# x64 的 APFS DMG 时 hdiutil detach 会失败（electron-builder 25.x 已知问题）。
# zip 内含 .app，解压即可用，arm64 runner 上稳定。
# 如需 dmg，可在本地 macOS（Intel 或 arm）执行 `npx electron-builder --mac dmg`。
mac:
  icon: icon.icns
  target:
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  notarize: false

npmRebuild: false
