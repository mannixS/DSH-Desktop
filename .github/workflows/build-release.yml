name: Build & Release

# 触发方式：
#   1. 推送 v 前缀 tag（如 v1.0.0）→ 构建双平台并创建 GitHub Release
#   2. 手动触发（Actions 页面 Run workflow）→ 仅构建并上传 artifact，不创建 Release；
#      填写 sync_tag（如 v1.0.29）时仅执行 CNB 补同步，用于补齐历史版本
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sync_tag:
        description: '仅补同步到 CNB 的标签（如 v1.0.29）；留空则只做手动构建，不同步'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    # 手动触发且填写 sync_tag 时属于"仅补同步"，跳过构建以免浪费时间
    # （用 github.event.inputs 而非 inputs：前者在所有事件下都稳定可取，便于诊断）
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.sync_tag == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: --win
          - name: macos
            os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 打包（预下载内置内核 + 内置 Node.js）
      # --publish never：禁用 electron-builder 自动上传（需 GH_TOKEN），
      # 产物统一由下方 release job 用 action-gh-release 上传
      - name: Build installer
        shell: bash
        run: |
          npm run fetch-kernel
          npm run fetch-node
          # electron-builder 需从 GitHub CDN 下载 Electron 二进制（~115MB），
          # 网络抖动可能导致下载中断（连接被强制关闭，日志中可见 wsarecv 错误）。
          # 失败时清理残留产物与 Electron 缓存后重试（最多 3 次），
          # 避免单次网络抖动使整个双端发布流程失败。
          for i in 1 2 3; do
            echo "===> electron-builder 第 $i 次尝试"
            if npx electron-builder ${{ matrix.platform }} --publish never; then
              exit 0
            fi
            echo "===> 第 $i 次失败，清理产物与 Electron 缓存后重试..."
            rm -rf dist
            rm -rf "$HOME/.cache/electron" "$LOCALAPPDATA/electron/Cache"
            sleep 10
          done
          exit 1
        env:
          # 内核版本（如需固定可改，缺省 latest）
          DSH_KERNEL_VERSION: latest

      # 收集产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    # 仅在推送 tag 时创建 Release；手动触发只产出 artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSH Desktop ${{ github.ref_name }}
          body: |
            ## DSH Desktop ${{ github.ref_name }}

            DeepSeek Harness 跨平台桌面客户端，内置 dsh 内核，支持内核一键更新与回滚。

            ### 安装包
            - Windows x64：`DSH-Desktop-*-win-x64.exe`
            - macOS（Apple Silicon）：`DSH-Desktop-*-mac-arm64.dmg`（推荐，双击直接安装）
            - macOS（Apple Silicon，解压版）：`DSH-Desktop-*-mac-arm64.zip`
            - macOS（Intel）：`DSH-Desktop-*-mac-x64.zip`（解压后把 DSH Desktop.app 拖入"应用程序"）
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-cnb:
    name: Sync to CNB (cnb.cool)
    # 等 GitHub Release 就绪后再推送 tag：CNB 流水线需要从 GitHub Release 拉取产物做国内镜像。
    # 也支持手动补同步：workflow_dispatch 时填写 sync_tag 即可（无需重新发版）。
    # 注意：必须用 always() —— 手动触发时 release job 会被跳过（未声明 tag），
    # 若不加 always()，依赖它的本 job 会被 GitHub 判定为 skipped 而连带跳过。
    if: always() && ((github.event_name == 'workflow_dispatch' && github.event.inputs.sync_tag != '') || (startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'))
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 把 main 与 tag 同步到 CNB，触发 CNB 侧 .cnb.yml 的镜像发布流水线。
      # 凭据可放在 Repository secrets 或 Repository variables；
      # 本 job 未声明 environment，因此请勿把凭据配置在 environment 中（那样取不到值）。
      # 未配置时自动跳过并给出 warning，不影响 GitHub 侧发布。
      - name: Push code and tag to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN || vars.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO || secrets.CNB_REPO }}
          SYNC_TAG: ${{ github.event.inputs.sync_tag || github.ref_name }}
        run: |
          echo "事件=${GITHUB_EVENT_NAME}  ref=${GITHUB_REF}  待同步标签=${SYNC_TAG}"
          missing=""
          if [ -z "$CNB_TOKEN" ]; then missing="${missing} CNB_TOKEN"; fi
          if [ -z "$CNB_REPO" ]; then missing="${missing} CNB_REPO"; fi
          if [ -n "$missing" ]; then
            echo "::warning::缺少配置：${missing}"
            echo "::warning::请在仓库 Settings → Secrets and variables → Actions 中配置："
            echo "::warning::  - Repository secrets：CNB_TOKEN（CNB 访问令牌，需 repo-contents 读写）"
            echo "::warning::  - Repository variables 或 secrets：CNB_REPO（如 mannixS/DSH-Desktop）"
            echo "::warning::注意：不要配置在 environment 中（本 workflow 未声明 environment，取不到值）。"
            exit 0
          fi
          echo "同步标签：${SYNC_TAG}"
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git"
          git push cnb "HEAD:refs/heads/main" --force
          git push cnb "refs/tags/${SYNC_TAG}" --force
          echo "已同步到 CNB：${CNB_REPO}@${SYNC_TAG}"
