name: Build & Release

# 触发方式：
#   1. 推送 v 前缀 tag（如 v1.0.0）→ 构建双平台并创建 GitHub Release
#   2. 手动触发（Actions 页面 Run workflow）→ 仅构建并上传 artifact，不创建 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: --win
          - name: macos
            os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 打包（预下载内置内核 + 内置 Node.js）
      # --publish never：禁用 electron-builder 自动上传（需 GH_TOKEN），
      # 产物统一由下方 release job 用 action-gh-release 上传
      - name: Build installer
        shell: bash
        run: |
          npm run fetch-kernel
          npm run fetch-node
          # electron-builder 需从 GitHub CDN 下载 Electron 二进制（~115MB），
          # 网络抖动可能导致下载中断（连接被强制关闭，日志中可见 wsarecv 错误）。
          # 失败时清理残留产物与 Electron 缓存后重试（最多 3 次），
          # 避免单次网络抖动使整个双端发布流程失败。
          for i in 1 2 3; do
            echo "===> electron-builder 第 $i 次尝试"
            if npx electron-builder ${{ matrix.platform }} --publish never; then
              exit 0
            fi
            echo "===> 第 $i 次失败，清理产物与 Electron 缓存后重试..."
            rm -rf dist
            rm -rf "$HOME/.cache/electron" "$LOCALAPPDATA/electron/Cache"
            sleep 10
          done
          exit 1
        env:
          # 内核版本（如需固定可改，缺省 latest）
          DSH_KERNEL_VERSION: latest

      # 收集产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    # 仅在推送 tag 时创建 Release；手动触发只产出 artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSH Desktop ${{ github.ref_name }}
          body: |
            ## DSH Desktop ${{ github.ref_name }}

            DeepSeek Harness 跨平台桌面客户端，内置 dsh 内核，支持内核一键更新与回滚。

            ### 安装包
            - Windows x64：`DSH-Desktop-*-win-x64.exe`
            - macOS（Apple Silicon）：`DSH-Desktop-*-mac-arm64.dmg`（推荐，双击直接安装）
            - macOS（Apple Silicon，解压版）：`DSH-Desktop-*-mac-arm64.zip`
            - macOS（Intel）：`DSH-Desktop-*-mac-x64.zip`（解压后把 DSH Desktop.app 拖入"应用程序"）
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
